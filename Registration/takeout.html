<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" type="image/png" sizes="16x16" href="fevi.png">
    <title>Takeout Order</title>
    <style>
        body {
            background-color: #121212;
            background-image: url('background.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            color: #fff;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1b1b1b;
            padding: 20px;
            text-align: center;
            color: #C1A57B;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }
        footer {
            background-color: #1b1b1b;
            padding: 30px;
            text-align: center;
            color: #d9d9d9;
            font-size: 0.9rem;
            border-top: 1px solid #C1A57B;
        }
        footer a {
            color: #C1A57B;
            text-decoration: none;
            transition: color 0.3s;
        }
        footer a:hover {
            color: #A08C65;
        }
        .form-container {
            width: 750px;
            margin: 100px auto;
            background-color: rgba(0, 0, 0, 0.9);
            border: 2px solid #c8ad7f;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.6);
        }
        .form-container h1 {
            text-align: center;
            color: #c8ad7f;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .form-container label {
            font-size: 1.1em;
            color: #c8ad7f;
        }
        .form-container input,
        .form-container textarea,
        .form-container select {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #c8ad7f;
            border-radius: 5px;
            background-color: #121212;
            color: #fff;
            font-size: 1em;
        }
        .form-container button {
            width: 100%;
            padding: 15px;
            background-color: #c8ad7f;
            color: #121212;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #fff;
        }
    </style>
</head>

<body>
    <header>
        <h1>EPICURIA</h1>
        <p>Divine | Luxurious Taste | Cozy Atmosphere</p>
    </header>
    <div class="form-container">
        <h1>Takeout Order Form</h1>
        <form>
            <div class="section">
                <label>Full Name:</label><br>
                <input type="text" placeholder="First Name" required>
                <input type="text" placeholder="Last Name" required>
            </div>
            <div class="section">
                <label>Phone Number:</label><br>
                <input type="tel" placeholder="000-000-0000" required>
            </div>
            <div class="section">
                <label>Email:</label><br>
                <input type="email" placeholder="e.g., myname@example.com" required>
            </div>
            <div class="section">
                <label>Pickup Date:</label>
                <input type="date" required>
                <label>Pickup Time:</label>
                <input type="time" required>
            </div>
            <div class="section">
                <label>Select Your Items:</label><br>
                <textarea placeholder="List your items here..." required></textarea>
            </div>
            <div class="section">
                <label>Special Instructions:</label><br>
                <textarea placeholder="E.g., no onions, extra sauce"></textarea>
            </div>
            <button type="submit">Place Order</button>
        </form>
    </div>
    <footer>
        <p>&copy; 2025 EPICURIA. All rights reserved.</p>
        <p>Follow us on <a href="#">Facebook</a>, <a href="#">Instagram</a>, and <a href="#">Twitter</a>.</p>
    </footer>
</body>
</html>
