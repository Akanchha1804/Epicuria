        const filters = ["DineType", "meal", "taste", "cuisine", "type", "variety"];
        const filterValues = {};

        // Create filter UI
        const filterDiv = d3.select("#filters");
        filters.forEach(filter => {
            const group = filterDiv.append("div").attr("class", "filter-group");
            const title = group.append("div")
                .attr("class", "filter-title")
                .html(`${filter.charAt(0).toUpperCase() + filter.slice(1)} <span>▶</span>`)
                .on("click", function() {
                    const options = group.select(".filter-options");
                    const isVisible = options.style("display") === "block";
                    options.style("display", isVisible ? "none" : "block");
                    d3.select(this).select("span").style("transform", isVisible ? "rotate(0deg)" : "rotate(90deg)");
                });

            const optionsDiv = group.append("div").attr("class", "filter-options");
            const values = [...new Set(data.flatMap(d => d.categories[filter] || []))];
            values.forEach(value => {
                optionsDiv.append("div")
                    .attr("class", "filter-tile")
                    .text(value)
                    .on("click", function() {
                        d3.select(this.parentNode).selectAll(".filter-tile").classed("selected", false);
                        d3.select(this).classed("selected", true);
                        filterValues[filter] = value;
                        updateResults();
                    });
            });
        });

        // Update results based on filters
        function updateResults() {
            const filtered = data.filter(d => {
                return filters.every(f => !filterValues[f] || (Array.isArray(d.categories[f]) ?
                    d.categories[f].includes(filterValues[f]) :
                    d.categories[f] === filterValues[f]));
            });

            const resultsDiv = d3.select("#results").html("");
            if (filtered.length === 0) {
                resultsDiv.append("p").text("No food items match your criteria.").style("text-align", "center");
            } else {
                const tiles = resultsDiv.selectAll(".food-item").data(filtered);

                tiles.enter()
                    .append("div")
                    .attr("class", "food-item")
                    .html(d => `
                        <img src="${d.image}" alt="${d.name}">
                        <p>${d.name}</p>
                    `)
                    .on("click", (event, d) => showCustomization(d))
                    .merge(tiles)
                    .html(d => `
                        <img src="${d.image}" alt="${d.name}">
                        <p>${d.name}</p>
                    `)
                    .on("click", (event, d) => showCustomization(d));

                tiles.exit().remove();
            }
        }

        // Show customization options
        function showCustomization(item) {
            const customizationDiv = d3.select("#customization").html("");
            customizationDiv.append("h3").text(`Customize: ${item.name}`);
            customizationDiv.append("p").text("Mandatory: " + item.ingredients.mandatory.join(", "));
            const negotiableDiv = customizationDiv.append("div");
            negotiableDiv.append("p").text("Negotiable:");
            item.ingredients.negotiable.forEach(ing => {
                const checkbox = negotiableDiv.append("label");
                checkbox.append("input")
                    .attr("type", "checkbox")
                    .attr("value", ing)
                    .property("checked", true);
                checkbox.append("span").text(ing);
                negotiableDiv.append("br");
            });

            customizationDiv.append("button").text("Finalize Customizations").on("click", () => {
                        const details = customizations.map(cust =>
                                `${cust.name} without ${cust.excluded.join(", ")}${cust.additionalRequests ? ` (Additional Requests: ${cust.additionalRequests})` : ''}`
        ).join("\n");
                const subject = encodeURIComponent("Customized Orders");
                const body = encodeURIComponent(`Customizations:\n${details}`);

                // Open Gmail compose window with pre-filled subject and body
                const gmailComposeUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=sakanchha47@gmail.com&su=${subject}&body=${body}`;
                window.open(gmailComposeUrl, "_blank");
            });
        
        }

});
