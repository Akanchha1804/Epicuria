<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #c1a57b;
        }
        
        header {
            background-color: #1b1b1b;
            color: #c1a57b;
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #444;
        }
        
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }
        
        .cart-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #1b1b1b;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #444;
        }
        
        .cart-item:last-child {
            border-bottom: none;
        }
        
        .cart-item h3 {
            margin: 0;
            font-size: 1.2rem;
        }
        
        .cart-item p {
            margin: 0;
            color: #999;
        }
        
        .cart-item button {
            background-color: #c1a57b;
            color: #1b1b1b;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .cart-item button:hover {
            background-color: #a0845c;
        }
        
        .cart-total {
            text-align: right;
            font-size: 1.2rem;
            margin-top: 20px;
            color: #c1a57b;
        }
        
        .cart-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .cart-actions button {
            background-color: #c1a57b;
            color: #1b1b1b;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .cart-actions button:hover {
            background-color: #a0845c;
        }
        
        .empty-cart {
            text-align: center;
            color: #999;
            font-size: 1.2rem;
            margin-top: 50px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            background-color: #1b1b1b;
            color: #c1a57b;
            margin-top: 30px;
        }
        
        footer p {
            margin: 5px 0;
        }
    </style>
</head>

<body>
    <header>
        <h1>Your Cart</h1>
        <p style="margin:5px 0"><a href="../Menu/Menu_Page.html" style="color:#C1A57B;text-decoration:none;">← Back to Menu</a></p>
    </header>

    <div class="cart-container">
        <div id="cart-items">
            <!-- Cart items will be dynamically inserted here -->
        </div>

        <p id="cart-total" class="cart-total">Total: ₹0.00</p>

        <div class="cart-actions">
            <button onclick="clearCart()">Clear Cart</button>
            <button onclick="checkout()">Checkout</button>
        </div>
    </div>

    <p id="empty-cart-message" class="empty-cart" style="display: none;">Your cart is empty!</p>

    <footer>
        <p>Restaurant St. Delicious City, London</p>
        <p>Open: 8:00 AM - 10:00 PM</p>
        <p>&copy; 2025 RestauR. All Rights Reserved.</p>
    </footer>

    <script>
        function updateCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotalElement = document.getElementById('cart-total');
            const emptyCartMessage = document.getElementById('empty-cart-message');

            cartItemsContainer.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                emptyCartMessage.style.display = 'block';
                cartTotalElement.style.display = 'none';
                return;
            } else {
                emptyCartMessage.style.display = 'none';
                cartTotalElement.style.display = 'block';
            }

            cart.forEach((item, index) => {
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';

                cartItem.innerHTML = `
                    <div>
                        <h3>${item.name}</h3>
                        <p>Price: ₹${item.price.toFixed(2)}</p>
                    </div>
                    <button onclick="removeFromCart(${index})">Remove</button>
                `;

                cartItemsContainer.appendChild(cartItem);
                total += item.price;
            });

            cartTotalElement.textContent = `Total: ₹${total.toFixed(2)}`;
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCart();
        }

        function clearCart() {
            localStorage.removeItem('cart');
            updateCart();
        }

        function checkout() {
            alert('Checkout feature is under development.');
        }

        window.onload = updateCart;
    </script>
</body>

</html>
