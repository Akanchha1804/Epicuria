<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Epicuria</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0b0a">
  <link rel="icon" type="image/png" href="/Epicuria/assets/img/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(900px 500px at 80% 0%, rgba(193, 165, 123, 0.1), transparent 60%),
        #0c0b0a;
      color: #e9e3d8;
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
    }
    a { color: #c1a57b; text-decoration: none; }
    a:hover { color: #ddc6a0; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
      color: #f4efe6;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid #c1a57b;
      border-radius: 50%;
      color: #c1a57b;
      font-size: 1.6rem;
      letter-spacing: 0;
    }
    .code {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(6rem, 20vw, 11rem);
      font-weight: 500;
      line-height: 0.85;
      color: #c1a57b;
    }
    h1 {
      margin: 1rem 0 0.5rem;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.9rem, 4vw, 2.8rem);
      font-weight: 600;
      color: #f4efe6;
    }
    p {
      max-width: 430px;
      margin: 0 auto 2rem;
      color: #b1a89b;
      line-height: 1.65;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0.75rem 1.5rem;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .btn--gold { background: #c1a57b; border-color: #c1a57b; color: #14110d; }
    .btn--gold:hover { background: #ddc6a0; color: #14110d; }
    .btn--ghost { border-color: rgba(244, 239, 230, 0.3); color: #f4efe6; }
    .btn--ghost:hover { border-color: #c1a57b; color: #ddc6a0; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/Epicuria/" aria-label="Epicuria home">
      <span class="mark" aria-hidden="true">E</span>
      Epicuria
    </a>
    <p class="code" aria-hidden="true">404</p>
    <h1>This table isn't set.</h1>
    <p>The page you were looking for may have moved. The menu, taste board and reservations are all still here.</p>
    <div class="actions">
      <a class="btn btn--gold" href="/Epicuria/">Back to home</a>
      <a class="btn btn--ghost" href="/Epicuria/menu.html">See the menu</a>
    </div>
  </main>
</body>
</html>
